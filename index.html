
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoveFIT Assistente</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f3;
      margin: 0;
      padding: 30px 15px;
      color: #202820;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px #0001;
    }

    header {
      background: #176b45;
      color: white;
      padding: 22px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    #mensagens {
      padding: 20px;
      min-height: 300px;
      max-height: 400px;
      overflow-y: auto;
    }

    .mensagem {
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      white-space: pre-wrap;
    }

    .bot {
      background: #e8f4ec;
    }

    .usuario {
      background: #dce8ff;
      text-align: right;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      background: #176b45;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #105335;
    }

    .sugestoes {
      padding: 0 15px 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>MoveFIT Assistente</h1>
      <p>Sua parceira de treino, a qualquer hora!</p>
    </header>

    <section id="mensagens" aria-live="polite">
      <div class="mensagem bot">
        Olá! Sou a MoveFIT, sua assistente virtual.
        Como posso ajudar no seu treino?
      </div>
    </section>

    <div class="sugestoes">
      <button type="button" onclick="perguntar('treino')">
        Meu treino
      </button>
      <button type="button" onclick="perguntar('exercícios')">
        Exercícios
      </button>
      <button type="button" onclick="perguntar('ajuda')">
        Ajuda
      </button>
    </div>

    <form id="formulario">
      <input id="entrada"
        placeholder="Digite sua pergunta..."
        aria-label="Sua pergunta"
        required>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script>
    const mensagens = document.getElementById("mensagens");
    const entrada = document.getElementById("entrada");
    const formulario = document.getElementById("formulario");

    function adicionarMensagem(texto, classe) {
      const div = document.createElement("div");
      div.className = "mensagem " + classe;
      div.textContent = texto;
      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    function responder(pergunta) {
      const texto = pergunta.toLowerCase();

      if (texto.includes("treino")) {
        return "Exemplo de treino:\n" +
          "1. Agachamento: 3 séries de 10 repetições.\n" +
          "2. Supino: 3 séries de 10 repetições.\n" +
          "3. Remada: 3 séries de 12 repetições.\n\n" +
          "Consulte seu professor para adequar os exercícios.";
      }

      if (texto.includes("exerc")) {
        return "Posso explicar exercícios de pernas, " +
          "peito, costas, braços e abdômen. " +
          "Qual grupo muscular você quer conhecer?";
      }

      if (texto.includes("ajuda") || texto.includes("olá") ||
          texto.includes("oi")) {
        return "Estou aqui para ajudar! Você pode perguntar " +
          "sobre treinos, exercícios ou sua rotina na academia.";
      }

      return "Ainda não sei responder a essa pergunta. " +
        "Experimente perguntar sobre seu treino ou exercícios.";
    }

    function perguntar(texto) {
      adicionarMensagem(texto, "usuario");
      adicionarMensagem(responder(texto), "bot");
    }

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      const texto = entrada.value.trim();
      if (!texto) return;

      perguntar(texto);
      entrada.value = "";
      entrada.focus();
    });
  </script>
</body>
</html>
